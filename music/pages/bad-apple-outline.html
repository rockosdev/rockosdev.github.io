<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bad Apple Outline</title>
    <style>
      :root {
        color-scheme: dark;
        background: #000;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
      }

      #app {
        position: relative;
        width: 100%;
        height: 100%;
        background: #000;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      video {
        display: none;
      }
    </style>
  </head>
  <body>
    <main id="app">
      <canvas id="stage"></canvas>
      <video id="source" src="/source/video.mp4" playsinline loop crossorigin="anonymous"></video>
    </main>
    <script type="module" src="./bad-apple-outline.ts"></script>
  </body>
</html>
